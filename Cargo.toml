[package]
name = "handwriting-input"
version = "0.1.0"
edition = "2021"
description = "Handwriting input keyboard for Linux (Wayland, egui) using the Google handwriting API"
license = "MIT"

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["wayland"] }
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles"] }

# `system` selects the libwayland (sys) backend — the only backend that exposes
# raw wl_surface/wl_display pointers, which wgpu needs to present to our surface.
# `dlopen` stops wayland-sys from probing pkg-config at build time (NixOS has
# none); libwayland is loaded dynamically at runtime instead.
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", default-features = false, features = ["gzip", "rustls"] }
libc = "0.2"
pollster = "1"

[profile.release]
lto = "thin"
strip = true
